[Builtin Hooks]
gofmt = true
bpfmt = true
ktfmt = true
rustfmt = true

[Hook Scripts]
do_not_use_DO_NOT_MERGE = ${REPO_ROOT}/build/soong/scripts/check_do_not_merge.sh ${PREUPLOAD_COMMIT}

ktlint_hook = ${REPO_ROOT}/prebuilts/ktlint/ktlint.py --no-verify-format -f ${PREUPLOAD_FILES}

[Builtin Hooks Options]
ktfmt = --kotlinlang-style --include-dirs=cmd/kotlinc_incremental
rustfmt = --config-path=${REPO_ROOT}/build/soong/scripts/rustfmt.toml

[Tool Paths]
ktfmt = ${REPO_ROOT}/external/ktfmt/ktfmt.sh
rustfmt = ${REPO_ROOT}/prebuilts/rust-toolchain/linux-x86/stable/rustfmt