syntax = "proto2";

package build_license_metadata;
option go_package = "android/soong/compliance/license_metadata_proto";

message LicenseMetadata {
  // package_name identifies the source package. License texts are named relative to the package name.
  optional string package_name = 1;

  // module_name identifies the target
  optional string module_name = 14;

  repeated string module_types = 2;

  repeated string module_classes = 3;

  // projects identifies the git project(s) containing the associated source code.
  repeated string projects = 4;

  // license_kinds lists the kinds of licenses. e.g. SPDX-license-identifier-Apache-2.0 or legacy_notice.
  repeated string license_kinds = 5;

  // license_conditions lists the conditions that apply to the license kinds. e.g. notice or restricted.
  repeated string license_conditions = 6;

  // license_texts lists the filenames of the associated license text(s).
  repeated string license_texts = 7;

  // is_container is true for target types that merely aggregate. e.g. .img or .zip files.
  optional bool is_container = 8;

  // built lists the built targets.
  repeated string built = 9;

  // installed lists the installed targets.
  repeated string installed = 10;

  // installMap identifies the substitutions to make to path names when moving into installed location.
  repeated InstallMap install_map = 11;

  // sources lists the targets depended on.
  repeated string sources = 12;

  // deps lists the license metadata files depended on.
  repeated AnnotatedDependency deps = 13;

  // public_source names the public copy that the prebuilt files of the target come from.
  optional PublicSource public_source = 15;

  // next id: 16

}

// PublicSource messages describe a public copy of prebuilt files, from which they can be fetched
// in place of shipping them.
message PublicSource {
  // The name of the public_source module.
  optional string name = 1;

  oneof location {
    GitRepository git = 2;
    Archive archive = 3;
    ImageArchive image_archive = 5;
  }

  // The prebuilt files of the target found in the public source.
  repeated PublicSourceFile files = 4;
}

// GitRepository messages describe a git repository at one commit.
message GitRepository {
  optional string url = 1;
  optional string commit = 2;
}

// Archive messages describe an archive file.
message Archive {
  optional string url = 1;
  optional string sha256 = 2;

  // The length of the archive in bytes.
  optional int64 size = 3;
}

// ImageArchive messages describe a 7z archive of partition images, each named <partition>.img,
// split into parts. The path of a file in it starts with the partition whose image contains the
// file. A path of a partition name alone names the whole image of the partition.
message ImageArchive {
  // The parts in the order in which they form the archive.
  repeated ArchivePart parts = 1;
}

// ArchivePart messages describe one file of an archive split into parts.
message ArchivePart {
  optional string url = 1;
  optional string sha256 = 2;

  // The length of the part in bytes.
  optional int64 size = 3;
}

// PublicSourceFile messages describe one prebuilt file found in a public source.
message PublicSourceFile {
  // The path of the file in the source tree.
  optional string file = 1;

  // The path of the file inside the public source.
  optional string path = 2;

  // The SHA-256 that the declaration names for the file in the public source, if any.
  optional string sha256 = 3;

  // The SHA-256 of the file in the source tree.
  optional string file_sha256 = 4;

  // The path of the file that the build installs from the file in the source tree. It differs
  // from the file in the source tree when the build changes the file on the way, as it does when
  // it signs an APK again.
  optional string installed = 5;

  // The SHA-256 of the installed file.
  optional string installed_sha256 = 6;

  // The length in bytes that the declaration names for the file in the public source, if any.
  optional int64 size = 7;

  // The path of the delta file of our edit in the source tree, which makes the file in the source
  // tree from the file in the public source with its fixups made, if we edited the file.
  optional string delta = 8;

  // The fixups of extract-utils, made in order on the file in the public source before the delta.
  repeated Fixup fixups = 9;
}

// Fixup messages describe one fixup that extract-utils makes on a stock file: a method of the
// blob_fixups of a device tree, or the FIX_SONAME argument of a file.
message Fixup {
  oneof edit {
    LibraryReplacement replace_needed = 1;

    // A library that the file needs too.
    string add_needed = 2;

    // The soname that the file gets.
    string set_soname = 3;

    RegexReplacement binary_regex_replace = 4;
  }
}

// LibraryReplacement messages describe a needed library and the library that replaces it.
message LibraryReplacement {
  optional string from = 1;
  optional string to = 2;
}

// RegexReplacement messages describe a Python regular expression of the bytes of a file and the
// bytes that replace each of its matches.
message RegexReplacement {
  optional string pattern = 1;
  optional string replacement = 2;
}

// InstallMap messages describe the mapping from an input filesystem file to the path to the file
// in a container.
message InstallMap {
  // The input path on the filesystem.
  optional string from_path = 1;

  // The path to the file inside the container or installed location.
  optional string container_path = 2;
}

// AnnotateDepencency messages describe edges in the build graph.
message AnnotatedDependency {
  // The path to the dependency license metadata file.
  optional string file = 1;

  // The annotations attached to the dependency.
  repeated string annotations = 2;
}
